[compatibility]
# Load configuration from /etc/rhsm/rhsm.conf. When set to true, rhc
# reads the configuration file of subscription-manager and uses relevant
# values as configuration options recognized by rhc.
# Defaults to true.
#interpret-legacy-configurations = true

[http.timeout]
# Connection timeout in seconds.
#connect = 30
# Request timeout in seconds.
#request = 180
# Idle connection timeout in seconds.
#idle = 120

[http.proxy]
# Full proxy URI including scheme and port.
# Example: https://proxy.example.org:3128
#uri = ""
#user = ""
#password = ""
# Comma-separated list of hosts or domains to bypass the proxy.
#no-proxy = ""

[api.insights.ingress]
# Full URI of the Insights ingress endpoint that rhc-collector uploads
# archives to. When unset, it is derived from the registration server.
#uri = "https://cert.console.redhat.com/api/ingress/v1/upload"
# Verify the server's TLS certificate.
# Defaults to true.
#tls-verify = true
# Path to the CA bundle used to verify the server's TLS certificate.
# Use "system" to select the system trust store. When unset, it is
# derived from subscription-manager's configuration.
#ca-path = "system"

[collector]
# Parent directory under which rhc-collector creates its private working
# directories while running collectors. Custom locations may
# require changes to the service sandbox and SELinux labeling.
# Defaults to /var/tmp.
#tmp-dir = "/var/tmp"
