[compatibility]
# Load configuration from /etc/rhsm/rhsm.conf. When set to true, rhc
# reads the configuration file of subscription-manager and uses relevant
# values as configuration options recognized by rhc.
# Defaults to true.
#interpret-legacy-configurations = true

[http.timeout]
# Connection timeout in seconds.
#connect = 30
# Idle connection timeout in seconds.
#idle = 120

[http.proxy]
# Full proxy URI including scheme and port.
# Example: https://proxy.example.org:3128
#uri = ""
#user = ""
#password = ""
# Comma-separated list of hosts or domains to bypass the proxy.
#no-proxy = ""
