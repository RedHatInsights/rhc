---
name: Betelgeuse Dry-Run for Docstrings Validation

on:
  pull_request:
    paths:
      - "integration-tests/**"

permissions:
  contents: read

jobs:
  betelgeuse:
    name: "betelgeuse dry-run"
    runs-on: ubuntu-latest
    container:
      image: fedora:latest # zizmor: ignore[unpinned-images] intentionally tracks current Fedora

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base setup for Betelgeuse
        run: |
          dnf --setopt install_weak_deps=False install -y \
              python3-pip
          python3 -m pip install betelgeuse

      - name: Run Betelgeuse
        run: |
          PYTHONPATH=integration-tests/ betelgeuse --config-module \
            custom_betelgeuse_config test-case --dry-run \
            integration-tests/ dryrun_project ./test_case.xml
