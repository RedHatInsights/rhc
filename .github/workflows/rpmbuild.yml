name: rpmbuild.yml
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rpmbuild:
    name: "rpmbuild"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Fedora latest"
            image: "registry.fedoraproject.org/fedora:latest"
            slug: "fedora-latest"
          - name: "Fedora Rawhide"
            image: "registry.fedoraproject.org/fedora:rawhide"
            slug: "fedora-rawhide"

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}

    steps:
      - name: "Install basic packages for 'dnf builddep'"
        run: |
          dnf --setopt install_weak_deps=False install -y \
            git rpm-build go-vendor-tools go-rpm-macros

      - name: "Checkout repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: "Adding repository directory to the temporary git global config as a safe directory (again)"
        run: |
          git config --global --add safe.directory /__w/rhc/rhc

      - name: "Install required packages"
        run: |
          dnf --setopt install_weak_deps=False builddep -y rhc.spec

      - name: "Build RPM artifacts"
        run: |
          make rpm

      - name: "Collect RPM artifacts"
        run: |
          mkdir -p rpms
          cp ~/rpmbuild/RPMS/*/*.rpm rpms/

      - name: "Identify rhc RPM"
        id: find-rpm
        run: |
          shopt -s nullglob
          MATCHES=(rpms/rhc-[0-9]*.rpm)
          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "FAIL  No rhc RPM found in rpms/"
            exit 1
          fi
          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "FAIL  Expected exactly one rhc RPM, found ${#MATCHES[@]}:"
            printf '  %s\n' "${MATCHES[@]}"
            exit 1
          fi
          echo "rpm=${MATCHES[0]}" >> "$GITHUB_OUTPUT"

      - name: "Generate RPM manifest"
        id: manifest
        run: |
          rpm -qlp "${{ steps.find-rpm.outputs.rpm }}" > manifest.txt
          echo "path=manifest.txt" >> "$GITHUB_OUTPUT"

      - name: "Verify RPM manifest"
        uses: ./.github/actions/verify-rpm-manifest
        with:
          manifest: ${{ steps.manifest.outputs.path }}

      - name: "Verify RPM excludes runtime paths"
        uses: ./.github/actions/verify-rpm-excludes-runtime
        with:
          manifest: ${{ steps.manifest.outputs.path }}

      - name: "Verify systemd unit naming"
        uses: ./.github/actions/verify-rpm-unit-naming
        with:
          manifest: ${{ steps.manifest.outputs.path }}

      - name: "Verify RPM file permissions"
        uses: ./.github/actions/verify-rpm-permissions
        with:
          rpm: ${{ steps.find-rpm.outputs.rpm }}

      - name: "Verify collector config identity"
        uses: ./.github/actions/verify-rpm-collector-config
        with:
          rpm: ${{ steps.find-rpm.outputs.rpm }}

      - name: "Upload RPM artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: rpms-${{ matrix.slug }}
          path: rpms/
          retention-days: 30
