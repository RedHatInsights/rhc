name: Go

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: Updating ...
        run: sudo apt-get -qq update

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"

      - name: Go build (source)
        run: go build ./...

      - name: Go build (tests)
        run: go test ./...

      - name: Go vet
        run: go vet ./...
